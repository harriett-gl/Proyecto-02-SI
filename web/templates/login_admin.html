<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | TechMarket</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="auth-body">

<header class="auth-header">

    <a href="/" class="logo">
        Tech<span>Market</span>
    </a>

    <nav>
        <a href="/">Inicio</a>
        <a href="/#productos">Productos</a>
    </nav>

</header>


<main class="auth-container">

    <section class="auth-card">

        <div class="auth-icon">
            👤
        </div>

        <p class="auth-etiqueta">
            BIENVENIDO A TECHMARKET
        </p>

        <h1>
            Iniciar sesión
        </h1>

        <p class="auth-descripcion">
            Ingresa a tu cuenta para continuar.
        </p>


        {% if error %}

            <div class="auth-error">
                {{ error }}
            </div>

        {% endif %}


        <form
            action="/login"
            method="POST"
            class="auth-form"
        >

            <div class="auth-campo">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >

            </div>


            <div class="auth-campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-boton"
            >
                Iniciar sesión
            </button>

        </form>


        <div class="auth-separador">
            <span>o</span>
        </div>


        <p class="auth-cuenta">
            ¿Todavía no tienes una cuenta?

            <a href="/registro">
                Crear cuenta
            </a>
        </p>

    </section>

</main>


<footer>

    <strong>
        TechMarket
    </strong>

    <p>
        Tecnología para todos.
    </p>

</footer>

</body>

</html>
