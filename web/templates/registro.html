<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta | TechMarket</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='base.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='auth.css') }}"
    >
</head>


<body>

<header>

    <a href="/" class="logo">
        Tech<span>Market</span>
    </a>

    <nav>

        <a href="/">
            Inicio
        </a>

        <a href="/#productos">
            Productos
        </a>

        <a href="/login">
            Iniciar sesión
        </a>

    </nav>

</header>


<main class="auth-container">

    <section class="auth-card">

        <div class="auth-icono">
            ✦
        </div>


        <p class="auth-etiqueta">
            ÚNETE A TECHMARKET
        </p>


        <h1>
            Crear cuenta
        </h1>


        <p class="auth-descripcion">
            Crea tu cuenta y comienza a comprar tecnología.
        </p>


        {% if error %}

            <div class="auth-error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            class="auth-form"
        >

            <div class="auth-campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="auth-campo">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="auth-campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="auth-campo">

                <label for="confirmar_password">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmar_password"
                    name="confirmar_password"
                    placeholder="Repite tu contraseña"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-boton"
            >
                Crear cuenta
            </button>

        </form>


        <div class="auth-separador">
            <span>o</span>
        </div>


        <p class="auth-cuenta">

            ¿Ya tienes una cuenta?

            <a href="/login">
                Iniciar sesión
            </a>

        </p>

    </section>

</main>


<footer>

    <strong>
        Tech<span>Market</span>
    </strong>

    <p>
        Tecnología para todos.
    </p>

</footer>

</body>

</html>
