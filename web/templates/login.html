<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | TechMarket</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header>
    <a href="/" class="logo">
        Tech<span>Market</span>
    </a>

    <nav>
        <a href="/">Inicio</a>

        <a href="/registro">
            Crear cuenta
        </a>
    </nav>
</header>


<main class="auth-container">

    <section class="auth-card">

        <p class="admin-etiqueta">
            TECHMARKET
        </p>

        <h1>
            Iniciar sesión
        </h1>

        <p>
            Accede a tu cuenta para continuar.
        </p>

        {% if registrado %}

            <div class="mensaje-exito">
                ✓ Cuenta creada correctamente.
                Ya puedes iniciar sesión.
            </div>

        {% endif %}

        {% if error %}

            <div class="mensaje-error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            <div>
                <label>Correo electrónico</label>

                <input
                    type="email"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >
            </div>

            <div>
                <label>Contraseña</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Tu contraseña"
                    required
                >
            </div>

            <button
                type="submit"
                class="boton-admin"
            >
                Iniciar sesión
            </button>

        </form>


        <p class="auth-enlace">

            ¿No tienes cuenta?

            <a href="/registro">
                Crear cuenta
            </a>

        </p>

    </section>

</main>


<footer>
    <strong>TechMarket</strong>

    <p>
        Tecnología para todos.
    </p>
</footer>

</body>
</html>
